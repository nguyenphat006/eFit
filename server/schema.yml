openapi: 3.0.3
info:
  title: Admin Template API Documentation
  version: 1.0.0
  description: 'API của template quản trị Django + Next.js (tác giả: ERICSS)'
paths:
  /api/v1/ai-coach/ask/:
    post:
      operationId: ai_coach_ask_create
      summary: Hỏi đáp với eFit AI
      tags:
      - Trợ lý AI
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AskRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AskRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AskRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AskResponse'
          description: ''
  /api/v1/ai-coach/meal-plan/:
    post:
      operationId: ai_coach_meal_plan_create
      summary: Chia macro mục tiêu thành thực đơn 3 bữa (chưa lưu)
      tags:
      - Trợ lý AI
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MealPlanTargetsRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MealPlanTargetsRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MealPlanTargetsRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MealPlan'
          description: ''
  /api/v1/ai-coach/status/:
    get:
      operationId: ai_coach_status_retrieve
      summary: Trạng thái cấu hình AI
      tags:
      - Trợ lý AI
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiStatus'
          description: ''
  /api/v1/ai-coach/suggest-nutrition/:
    post:
      operationId: ai_coach_suggest_nutrition_create
      summary: Gợi ý mục tiêu dinh dưỡng / ngày
      tags:
      - Trợ lý AI
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuggestNutritionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SuggestNutritionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SuggestNutritionRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NutritionSuggestion'
          description: ''
  /api/v1/attachments/:
    get:
      operationId: attachments_list
      description: |-
        ViewSet quản lý tệp đính kèm đa hình (Polymorphic Attachment Storage).
        Hỗ trợ upload ảnh, bản vẽ CAD, PDF, tài liệu Word/Excel cho bất kỳ thực thể nào trong hệ thống.
      summary: Lấy danh sách tệp đính kèm theo thực thể
      parameters:
      - in: query
        name: entity_id
        schema:
          type: integer
        description: ID của thực thể
      - in: query
        name: entity_type
        schema:
          type: string
        description: 'Loại thực thể: USER, PRODUCT_BASE, MATERIAL, WORK_ORDER...'
      - in: query
        name: file_category
        schema:
          type: string
        description: 'Phân loại tệp: IMAGE, CAD_DRAWING, SPEC_SHEET, CONTRACT, DOCUMENT,
          OTHER'
      - in: query
        name: is_active
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - Tệp Đính Kèm (Attachments)
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAttachmentList'
          description: ''
    post:
      operationId: attachments_create
      description: |-
        ViewSet quản lý tệp đính kèm đa hình (Polymorphic Attachment Storage).
        Hỗ trợ upload ảnh, bản vẽ CAD, PDF, tài liệu Word/Excel cho bất kỳ thực thể nào trong hệ thống.
      summary: Tải lên tệp đính kèm mới (Multipart Form-Data)
      tags:
      - Tệp Đính Kèm (Attachments)
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachmentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AttachmentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AttachmentRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
          description: ''
  /api/v1/attachments/{id}/:
    get:
      operationId: attachments_retrieve
      description: |-
        ViewSet quản lý tệp đính kèm đa hình (Polymorphic Attachment Storage).
        Hỗ trợ upload ảnh, bản vẽ CAD, PDF, tài liệu Word/Excel cho bất kỳ thực thể nào trong hệ thống.
      summary: Xem chi tiết thông tin tệp đính kèm
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Tệp đính kèm.
        required: true
      tags:
      - Tệp Đính Kèm (Attachments)
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
          description: ''
    put:
      operationId: attachments_update
      description: |-
        ViewSet quản lý tệp đính kèm đa hình (Polymorphic Attachment Storage).
        Hỗ trợ upload ảnh, bản vẽ CAD, PDF, tài liệu Word/Excel cho bất kỳ thực thể nào trong hệ thống.
      summary: Cập nhật ghi chú / phân loại tệp
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Tệp đính kèm.
        required: true
      tags:
      - Tệp Đính Kèm (Attachments)
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachmentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AttachmentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AttachmentRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
          description: ''
    patch:
      operationId: attachments_partial_update
      description: |-
        ViewSet quản lý tệp đính kèm đa hình (Polymorphic Attachment Storage).
        Hỗ trợ upload ảnh, bản vẽ CAD, PDF, tài liệu Word/Excel cho bất kỳ thực thể nào trong hệ thống.
      summary: Cập nhật một phần thông tin tệp
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Tệp đính kèm.
        required: true
      tags:
      - Tệp Đính Kèm (Attachments)
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAttachmentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAttachmentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAttachmentRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
          description: ''
    delete:
      operationId: attachments_destroy
      description: |-
        ViewSet quản lý tệp đính kèm đa hình (Polymorphic Attachment Storage).
        Hỗ trợ upload ảnh, bản vẽ CAD, PDF, tài liệu Word/Excel cho bất kỳ thực thể nào trong hệ thống.
      summary: Xóa tệp (xóa mềm)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Tệp đính kèm.
        required: true
      tags:
      - Tệp Đính Kèm (Attachments)
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/attachments/{id}/file/:
    get:
      operationId: attachments_file_retrieve
      description: Link lấy từ `file_url` (đã kiểm tra quyền khi sinh link) — dùng
        được cho <img>, xem trước, tải xuống.
      summary: Tải nội dung tệp qua link có chữ ký (hết hạn sau 1 giờ)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Tệp đính kèm.
        required: true
      tags:
      - Tệp Đính Kèm (Attachments)
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
          description: ''
  /api/v1/attachments/{id}/hard-delete/:
    delete:
      operationId: attachments_hard_delete_destroy
      description: Xóa vĩnh viễn file vật lý và bản ghi khỏi cơ sở dữ liệu.
      summary: Xóa vĩnh viễn tệp đính kèm khỏi hệ thống (Hard Delete)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Tệp đính kèm.
        required: true
      tags:
      - Tệp Đính Kèm (Attachments)
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/attachments/batch-delete/:
    post:
      operationId: attachments_batch_delete_create
      description: 'Xóa mềm hàng loạt. Body: {"ids": [...]}. Bản ghi bị `check_can_destroy`
        chặn sẽ được bỏ qua.'
      tags:
      - attachments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachmentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AttachmentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AttachmentRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
          description: ''
  /api/v1/attachments/batch-status/:
    post:
      operationId: attachments_batch_status_create
      description: 'Bật/tắt trạng thái hàng loạt. Body: {"ids": [...], "is_active":
        true | false}.'
      tags:
      - attachments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachmentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AttachmentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AttachmentRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
          description: ''
  /api/v1/attachments/excel-template/:
    get:
      operationId: attachments_excel_template_retrieve
      description: API Tải file mẫu Excel (.xlsx) dùng cho chức năng Nhập dữ liệu
        (Import).
      tags:
      - attachments
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
          description: ''
  /api/v1/attachments/export-columns/:
    get:
      operationId: attachments_export_columns_retrieve
      description: API trả về danh sách các trường dữ liệu (fields) của Model phục
        vụ cấu hình xuất file.
      tags:
      - attachments
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
          description: ''
  /api/v1/attachments/export-excel/:
    get:
      operationId: attachments_export_excel_retrieve
      description: API Xuất danh sách dữ liệu ra file Excel (.xlsx) hoặc CSV chuẩn
        Enterprise (Hỗ trợ Sync & Async Queue).
      tags:
      - attachments
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
          description: ''
    post:
      operationId: attachments_export_excel_create
      description: API Xuất danh sách dữ liệu ra file Excel (.xlsx) hoặc CSV chuẩn
        Enterprise (Hỗ trợ Sync & Async Queue).
      tags:
      - attachments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachmentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AttachmentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AttachmentRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
          description: ''
  /api/v1/attachments/statistics/:
    get:
      operationId: attachments_statistics_retrieve
      description: 'Số liệu tổng quan: tổng / đang hoạt động / ngưng / mới trong tháng.'
      tags:
      - attachments
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
          description: ''
  /api/v1/audit-logs/:
    get:
      operationId: audit_logs_list
      description: |-
        ViewSet cung cấp danh sách và chi tiết các sự kiện thay đổi dữ liệu (Audit Logs)
        được ghi lại tự động bởi PostgreSQL Triggers qua django-pghistory.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - Nhật Ký Thao Tác (Audit Logs)
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditLogEventList'
          description: ''
  /api/v1/audit-logs/{id}/:
    get:
      operationId: audit_logs_retrieve
      description: |-
        ViewSet cung cấp danh sách và chi tiết các sự kiện thay đổi dữ liệu (Audit Logs)
        được ghi lại tự động bởi PostgreSQL Triggers qua django-pghistory.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - Nhật Ký Thao Tác (Audit Logs)
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogEvent'
          description: ''
  /api/v1/audit-logs/options/:
    get:
      operationId: audit_logs_options_retrieve
      description: |-
        API trả về danh sách các Models và Actions cố định có trong hệ thống để làm dropdown filter trên giao diện.
        Toàn bộ Actions được đồng bộ hóa chuẩn xác theo danh mục RBAC của hệ thống.
        Danh sách Users được phục vụ độc lập qua API Users riêng (/api/v1/users/) để hỗ trợ phân trang và tìm kiếm.
      tags:
      - Nhật Ký Thao Tác (Audit Logs)
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogEvent'
          description: ''
  /api/v1/auth/change-password/:
    post:
      operationId: auth_change_password_create
      description: API Đổi mật khẩu cho người dùng hiện tại.
      tags:
      - Xác thực (Authentication)
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: 'API Đăng nhập: Trả về JWT Access Token, Refresh Token và Thông
        tin Người dùng kèm Roles.'
      tags:
      - Xác thực (Authentication)
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPairRequest'
        required: true
      responses:
        '200':
          description: No response body
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      description: 'API Đăng xuất: Blacklist Refresh Token phía máy chủ.'
      tags:
      - Xác thực (Authentication)
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LogoutRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LogoutRequestRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: API Lấy và Cập nhật thông tin tài khoản đang đăng nhập từ JWT Token.
      tags:
      - Xác thực (Authentication)
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserProfile'
          description: ''
    patch:
      operationId: auth_me_partial_update
      description: API Lấy và Cập nhật thông tin tài khoản đang đăng nhập từ JWT Token.
      tags:
      - Xác thực (Authentication)
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserProfileUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserProfileUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserProfileUpdateRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserProfile'
          description: ''
  /api/v1/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/clients/:
    get:
      operationId: clients_list
      description: |-
        Học viên do HLV quản lý. HLV chỉ thấy học viên của mình (lọc queryset theo coach); ADMIN thấy tất cả
        và được đổi HLV phụ trách. Không xóa được học viên còn mùa giải / nhật ký — chuyển trạng thái Lưu trữ.
      summary: Danh sách học viên
      parameters:
      - in: query
        name: coach
        schema:
          type: integer
      - in: query
        name: fitness_goal
        schema:
          type: string
          title: Mục tiêu
          enum:
          - BULKING
          - CUTTING
          - MAINTAINING
          - RECOMP
        description: |-
          * `BULKING` - Tăng cơ
          * `CUTTING` - Giảm mỡ
          * `MAINTAINING` - Duy trì
          * `RECOMP` - Tái cấu trúc cơ thể
      - in: query
        name: fitness_goal__in
        schema:
          type: array
          items:
            type: string
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      - in: query
        name: full_name__icontains
        schema:
          type: string
      - in: query
        name: gender
