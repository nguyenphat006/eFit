        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: phase
        schema:
          type: integer
      - in: query
        name: phase__season
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: updated_at__date__gte
        schema:
          type: string
          format: date
      - in: query
        name: updated_at__date__lte
        schema:
          type: string
          format: date
      tags:
      - Nhật ký hằng ngày
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
