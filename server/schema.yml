          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        phone_number:
          type: string
          nullable: true
          title: Số điện thoại liên hệ
          maxLength: 30
        avatar:
          type: string
          format: uri
          nullable: true
          title: Ảnh đại diện
        is_active:
          type: boolean
          title: Kích hoạt
          description: Chỉ định xem người dùng này phải được coi là đang hoạt động.
            Bạn nên bỏ chọn này thay vì xóa tài khoản.
        is_superuser:
          type: boolean
          title: Trạng thái superuser
          description: Định rằng người dùng này có tất cả các quyền mà không gán cho
            họ một cách cụ thể.
