          description: Yêu cầu. 150 ký tự hoặc ít hơn. Chỉ là chữ cái, chữ số và @/./+/-/_.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        name:
          type: string
          readOnly: true
        full_name:
          type: string
          title: Họ và tên hiển thị
          maxLength: 255
