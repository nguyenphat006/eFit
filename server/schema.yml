      description: |-
        Serializer tinh gọn hiển thị danh sách Tài khoản Người dùng (Users).
        Gói gọn các thông tin chính yếu (id, username, họ tên, email, sđt, avatar, roles, trạng thái, ngày tạo/cập nhật),
