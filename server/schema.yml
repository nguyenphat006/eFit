          readOnly: true
        last_login:
          type: string
          format: date-time
          readOnly: true
        description:
          type: string
          nullable: true
          title: Ghi chú tài khoản
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
