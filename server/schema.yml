components:
  schemas:
    ActiveSeason:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        goal_type:
          type: string
        client_name:
          type: string
          nullable: true
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        progress:
          type: integer
        days_left:
          type: integer
        current_phase:
          type: string
          nullable: true
      required:
      - client_name
      - current_phase
      - days_left
      - end_date
      - goal_type
      - id
      - name
      - progress
      - start_date
    ActivityPoint:
      type: object
      properties:
        date:
          type: string
          format: date
        count:
          type: integer
      required:
      - count
      - date
    AiStatus:
      type: object
      properties:
        configured:
          type: boolean
        model:
          type: string
          nullable: true
      required:
      - configured
      - model
    AskRequest:
      type: object
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 2000
        history:
          type: array
          items:
            $ref: '#/components/schemas/ChatTurnRequest'
      required:
      - question
    AskResponse:
      type: object
      properties:
        answer:
          type: string
      required:
      - answer
    Attachment:
      type: object
      description: Serializer cho tệp đính kèm đa hình (Attachments).
      properties:
        id:
          type: integer
          readOnly: true
        entity_type:
          type: string
          title: Loại thực thể
          description: 'VD: USER, PRODUCT_BASE, PRODUCT_VARIANT, MATERIAL, WORK_ORDER...'
          maxLength: 50
        entity_id:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          title: Mã Id của thực thể đính kèm
        file_name:
          type: string
          title: Tên gốc của tệp
          maxLength: 255
        file_url:
          type: string
          readOnly: true
        file_size:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          title: Dung lượng tệp (bytes)
        file_size_formatted:
          type: string
          readOnly: true
        mime_type:
          type: string
          nullable: true
          title: Định dạng MIME
          maxLength: 100
        file_category:
          allOf:
          - $ref: '#/components/schemas/FileCategoryEnum'
          title: Phân loại tệp
        description:
          type: string
          nullable: true
          title: Mô tả / Ghi chú kỹ thuật
        is_active:
          type: boolean
          title: Trạng thái hoạt động
        created_by:
          type: integer
          readOnly: true
          nullable: true
          title: Người tạo
        created_by_name:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
          title: Thời điểm cập nhật gần nhất
      required:
      - created_at
      - created_by
      - created_by_name
      - entity_id
      - entity_type
      - file_size_formatted
      - file_url
      - id
      - updated_at
    AttachmentRequest:
      type: object
      description: Serializer cho tệp đính kèm đa hình (Attachments).
      properties:
        entity_type:
          type: string
          minLength: 1
          title: Loại thực thể
          description: 'VD: USER, PRODUCT_BASE, PRODUCT_VARIANT, MATERIAL, WORK_ORDER...'
          maxLength: 50
        entity_id:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          title: Mã Id của thực thể đính kèm
        file:
          type: string
          format: binary
          writeOnly: true
          title: Tệp đính kèm
        file_name:
          type: string
          minLength: 1
          title: Tên gốc của tệp
          maxLength: 255
        file_size:
